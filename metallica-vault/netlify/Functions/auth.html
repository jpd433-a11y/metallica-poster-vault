<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metallica Poster Vault — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [data-theme="dark"] {
      --bg: #080808; --card: #141414; --border: #242424; --border-hi: #363636;
      --header-bg: #050505; --red: #c0392b; --red-hi: #e74c3c;
      --text: #e2e2e2; --text-sec: #999; --muted: #666; --input-bg: #0a0a0a;
    }
    [data-theme="light"] {
      --bg: #f5f3ef; --card: #ffffff; --border: #e0dbd4; --border-hi: #c8c0b8;
      --header-bg: #1a0a08; --red: #c0392b; --red-hi: #e74c3c;
      --text: #1a1a1a; --text-sec: #555; --muted: #888; --input-bg: #f5f3ef;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background 0.25s, color 0.25s;
    }

    header {
      background: var(--header-bg); border-bottom: 2px solid var(--red);
      padding: 0 28px; height: 68px; display: flex; align-items: center;
      justify-content: space-between; position: relative; overflow: hidden;
    }
    header::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(-55deg, transparent, transparent 18px, rgba(192,57,43,0.06) 18px, rgba(192,57,43,0.06) 19px);
    }
    .logo-mark { font-family: 'Black Ops One', cursive; font-size: 24px; color: #fff; letter-spacing: 2px; line-height: 1; position: relative; z-index: 1; }
    .logo-mark em { color: var(--red-hi); font-style: normal; }

    .theme-toggle { display: flex; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 3px; position: relative; z-index: 1; }
    .theme-btn { background: transparent; border: none; width: 30px; height: 26px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; color: rgba(255,255,255,0.5); transition: all 0.2s; }
    .theme-btn.active { background: var(--red); color: #fff; }

    .page-body {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
    }

    .auth-card {
      background: var(--card); border: 1px solid var(--border);
      border-top: 3px solid var(--red); border-radius: 8px;
      padding: 36px 32px; width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .auth-title {
      font-family: 'Black Ops One', cursive; font-size: 22px;
      color: var(--text); letter-spacing: 2px; margin-bottom: 4px;
    }
    .auth-title em { color: var(--red-hi); font-style: normal; }
    .auth-sub { font-size: 13px; color: var(--muted); letter-spacing: 1px; margin-bottom: 28px; }

    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab-btn {
      flex: 1; padding: 10px; background: transparent; border: none;
      font-family: 'Black Ops One', cursive; font-size: 13px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;
    }
    .tab-btn.active { color: var(--red-hi); border-bottom-color: var(--red); }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 10px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .form-control {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text); padding: 10px 12px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.5px;
      transition: border-color 0.15s;
    }
    .form-control:focus { outline: none; border-color: var(--red); }
    .form-control::placeholder { color: var(--muted); opacity: 0.5; }

    .btn-submit {
      width: 100%; padding: 12px; background: var(--red); border: none;
      border-radius: 3px; color: #fff; font-family: 'Black Ops One', cursive;
      font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.15s; margin-top: 6px;
    }
    .btn-submit:hover { background: var(--red-hi); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg { font-size: 13px; letter-spacing: 0.5px; padding: 10px 12px; border-radius: 3px; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(192,57,43,0.12); border: 1px solid rgba(192,57,43,0.3); color: #e74c3c; }
    .msg.success { background: rgba(39,174,96,0.12); border: 1px solid rgba(39,174,96,0.3); color: #2ecc71; }
    .msg.show { display: block; }

    .divider { text-align: center; font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: calc(50% - 30px); height: 1px; background: var(--border); }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    footer { border-top: 1px solid var(--border); padding: 16px 24px; text-align: center; }
    .footer-brand { font-family: 'Black Ops One', cursive; font-size: 13px; color: var(--muted); letter-spacing: 2px; }
    .footer-brand em { color: var(--red); font-style: normal; }
  </style>
</head>
<body>
  <header>
    <div class="logo-mark">⚡ <em>Metallica</em> Poster Vault</div>
    <div class="theme-toggle">
      <button class="theme-btn active" id="btn-dark" onclick="setTheme('dark')"><i class="ti ti-moon"></i></button>
      <button class="theme-btn" id="btn-light" onclick="setTheme('light')"><i class="ti ti-sun"></i></button>
    </div>
  </header>

  <div class="page-body">
    <div class="auth-card">
      <div class="auth-title">⚡ <em>Poster Vault</em></div>
      <div class="auth-sub">Track your Metallica collection</div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div id="msg" class="msg"></div>

      <!-- SIGN IN -->
      <div id="form-signin">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" id="si-email" type="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" id="si-password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')signIn()">
        </div>
        <button class="btn-submit" id="btn-signin" onclick="signIn()">Sign In</button>
      </div>

      <!-- SIGN UP -->
      <div id="form-signup" style="display:none">
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input class="form-control" id="su-name" type="text" placeholder="e.g. MetalliKev">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" id="su-email" type="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" id="su-password" type="password" placeholder="Min. 6 characters" onkeydown="if(event.key==='Enter')signUp()">
        </div>
        <button class="btn-submit" id="btn-signup" onclick="signUp()">Create Account</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-brand">⚡ <em>Metallica</em> Poster Vault</div>
  </footer>

  <script>
    const SUPABASE_URL = 'https://olppjterjslxypnqccbv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XawzbnyWt4bs17hkhVO27A_4lun6jWY';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const THEME_KEY = 'metallica_vault_theme';

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem(THEME_KEY, t);
      document.getElementById('btn-dark').classList.toggle('active', t === 'dark');
      document.getElementById('btn-light').classList.toggle('active', t === 'light');
    }

    function switchTab(tab) {
      document.getElementById('form-signin').style.display = tab === 'signin' ? 'block' : 'none';
      document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      hideMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type + ' show';
    }

    function hideMsg() {
      document.getElementById('msg').className = 'msg';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : (btnId === 'btn-signin' ? 'Sign In' : 'Create Account');
    }

    async function signIn() {
      const email    = document.getElementById('si-email').value.trim();
      const password = document.getElementById('si-password').value;
      if (!email || !password) { showMsg('Please fill in all fields.', 'error'); return; }
      setLoading('btn-signin', true);
      hideMsg();
      const { error } = await sb.auth.signInWithPassword({ email, password });
      setLoading('btn-signin', false);
      if (error) { showMsg(error.message, 'error'); return; }
      window.location.href = 'gallery.html';
    }

    async function signUp() {
      const name     = document.getElementById('su-name').value.trim();
      const email    = document.getElementById('su-email').value.trim();
      const password = document.getElementById('su-password').value;
      if (!name || !email || !password) { showMsg('Please fill in all fields.', 'error'); return; }
      if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
      setLoading('btn-signup', true);
      hideMsg();
      const { error } = await sb.auth.signUp({
        email, password,
        options: { data: { display_name: name } }
      });
      setLoading('btn-signup', false);
      if (error) { showMsg(error.message, 'error'); return; }
      showMsg('Account created! Check your email to confirm, then sign in.', 'success');
    }

    // redirect if already logged in
    async function init() {
      const t = localStorage.getItem(THEME_KEY) || 'dark';
      setTheme(t);
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'gallery.html';
    }

    init();
  </script>
</body>
</html>
